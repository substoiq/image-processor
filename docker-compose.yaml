###
# To run your image processing solution with docker-compose:
#
# Start the container: docker-compose up -d
# Place images in ./data/input/ and find processed results in ./data/output/
# View logs: docker-compose logs -f
# Stop when done: docker-compose down
####

version: "3.8"

services:
  image-processor:
    build: .
    container_name: image-processor-sh
    restart: unless-stopped
    volumes:
      - ./data/input:/data/input
      - ./data/output:/data/output
      - ./config:/app/config
    environment:
      - INPUT_DIR=/data/input
      - OUTPUT_DIR=/data/output
      - CONFIG_FILE=/app/config/settings.yaml
      - SLEEP_INTERVAL=5
